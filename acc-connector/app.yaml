# Purpose: Databricks Apps manifest for the connector's internal deployment (hybrid model —
# EC2 keeps serving external hub admins). Starts gunicorn via databricks_gunicorn.conf.py and
# wires config: plain values for non-secrets, valueFrom for every secret. valueFrom names are
# resource keys attached to the app in the Databricks UI; no secret value lives in this file.
# Must share SECRET_KEY, CONN_STRING and SECRET_STORE_PREFIX/APP_ENV with EC2.

command:
  - gunicorn
  - -c
  - databricks_gunicorn.conf.py
  - app:app

env:
  # --- Hybrid split: U2M timers run here only; EC2 sets ENABLE_U2M=false. ---
  - name: ENABLE_U2M
    value: 'true'

  # --- Shared state with EC2 (RDS Postgres + AWS Secrets Manager) ---
  - name: SECRET_KEY
    valueFrom: secret-key
  - name: CONN_STRING
    valueFrom: conn-string
  - name: SECRET_STORE_BACKEND
    value: 'aws'
  # Must equal EC2's values exactly — they are part of every secret ref path.
  - name: SECRET_STORE_PREFIX
    value: '<same-as-ec2>'
  - name: APP_ENV
    value: '<same-as-ec2>'
  - name: AWS_REGION
    value: '<same-as-ec2>'
  - name: AWS_ACCESS_KEY_ID
    valueFrom: aws-access-key-id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom: aws-secret-access-key

  # --- APS apps (same Client IDs as EC2; add the app callback URL in APS) ---
  - name: APS_CLIENT_ID
    value: '<GF6OxAa1BXVUhAMt4cKJgzvG0IFQ9cjFzp3NzLG9Hr1qBA0D>'
  - name: APS_CLIENT_SECRET
    valueFrom: QlmurqfjA9MSGS9f6VzxS058GZi9AWVh3G1rv8gCokmrxZDYFmKoiLrx7zhChx6e
  - name: APS_SSA_CLIENT_ID
    value: '<aps-server-to-server-client-id>'
  - name: APS_SSA_CLIENT_SECRET
    valueFrom: ap
  - name: APS_REDIRECT_URI
    value: 'https://<custom-etl>-<http://localhost:8000/callback>.<cloud>.databricksapps.com/callback'

  # --- Databricks U2M OAuth. DATABRICKS_CLIENT_ID/SECRET are the app's own service
  # principal here; backend/config.py ignores them. Per-user OAuth apps come from the DB. ---
  - name: DATABRICKS_REDIRECT_URI
    value: 'https://<custom-etl>-<dbc-d2c139d9-82ca>.<cloud>.databricksapps.com/databricks/callback'

  # --- Scheduled CDC is triggered on EC2 only; keeps /internal/scheduler/cdc fail-closed here. ---
  - name: LOG_LEVEL
    value: 'INFO'
