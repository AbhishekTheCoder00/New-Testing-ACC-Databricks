# Purpose: Databricks Apps manifest for the connector's deployment.
# Starts gunicorn via databricks_gunicorn.conf.py.
# valueFrom names are resource keys configured in the Databricks Apps UI.

command:
  - gunicorn
  - -c
  - databricks_gunicorn.conf.py
  - app:app

env:
  # --- Hybrid split: U2M timers run here only; EC2 sets ENABLE_U2M=false. ---
  - name: ENABLE_U2M
    value: 'true'

  # --- App state (Postgres DB + local Fernet-encrypted secret store) ---
  - name: SECRET_KEY
    value: 'f18a9ad192cdc40147e7167aa4b74487fe0e67415c3c155c7661c59e7c8250d7'
  # CONN_STRING not set — using SQLite (in-container, volatile on restart)
  - name: SECRET_STORE_BACKEND
    value: 'local'

  # --- APS apps (set secret values in Databricks Apps UI → Resources) ---
  - name: APS_CLIENT_ID
    value: eMIH5eEmkGvx6BOIlzotCdhwWyxEGRKsL1uTeANxOrMxc0qN
  - name: APS_CLIENT_SECRET
    value: 'pTaeKHZ3Un2PZwPYJgX6Dqbzurun7yibb6zCUvZflSmMsMAi7LpyG7vkX1uCoMz9'
  - name: APS_SSA_CLIENT_ID
    value: QljjXCIFTFSUNsOEAEfME65dQ5ALGuFobGfYCuRj4q06R4m9
  - name: APS_SSA_CLIENT_SECRET
    value: 'sbXt0BCHT8iCYApmx1PPvg4yBtAnYGvXrHD2L0HLVwSeOuNTG68Upm7caKfFZYiY'
  - name: APS_REDIRECT_URI
    value: 'https://data-transfer-etl-pipeline-7474646091056609.aws.databricksapps.com/callback'

  # --- Databricks U2M OAuth ---
  # CONNECTOR_DATABRICKS_CLIENT_ID overrides the platform-injected DATABRICKS_CLIENT_ID
  # (which is the app's service principal, not the user-facing OAuth app).
  - name: CONNECTOR_DATABRICKS_CLIENT_ID
    value: '6852a33b-c870-4237-88d0-4d7b1002ca46'
  - name: DATABRICKS_REDIRECT_URI
    value: 'https://data-transfer-etl-pipeline-7474646091056609.aws.databricksapps.com/databricks/callback'

  # --- Scheduled CDC is triggered on EC2 only; keeps /internal/scheduler/cdc fail-closed here. ---
  - name: LOG_LEVEL
    value: 'INFO'
